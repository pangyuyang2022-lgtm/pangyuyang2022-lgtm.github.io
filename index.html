/* VOICE: quiet, magical, a gift opened at night.
   IDEA: a dot-matrix terminal that "prints" a living tree onto a glowing golden clock-dial.
   PICTURE: the full-screen ASCII point-cloud tree, scanned up by a rising halo ring.
   COLOUR and TYPE: night ink #05060b, pine greens, gold #f2c45a accent; Great Vibes greeting, Space Mono glyphs, Outfit for controls.
   LAYOUT: one full-bleed canvas; greeting floats low centre; controls pinned bottom. */
:root{color-scheme:dark;--bg:#05060b;--ink:#efe6cf;--gold:#f2c45a;--glass:rgba(20,18,28,.62)}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;font:16px/1.5 "Outfit",system-ui,sans-serif}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c:active{cursor:grabbing}
#hint{position:fixed;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);padding:8px 16px;border-radius:99px;background:var(--glass);backdrop-filter:blur(8px);font-size:13px;color:#cfc6b0;white-space:nowrap;transition:opacity 1.2s;pointer-events:none}
#msg{position:fixed;left:50%;bottom:calc(44px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:92vw;margin:0;text-align:center;font:400 clamp(40px,7vw,68px)/1.1 "Great Vibes",cursive;color:var(--gold);text-shadow:0 0 18px rgba(242,196,90,.55),0 0 42px rgba(242,140,60,.25);opacity:0;transition:opacity 2s;outline:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 .3em}
#msg .to{display:block;margin-bottom:.05em;font:400 .62em/1.15 "Great Vibes",cursive;color:var(--gold)}
.emo{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;text-shadow:none;font-size:.82em;vertical-align:.05em}
#msg.on{opacity:1}
#hint{opacity:0}#hint.show{opacity:1}
#open{position:fixed;inset:0;display:grid;place-content:center;gap:22px;border:0;padding:0;background:radial-gradient(circle at 50% 55%,rgba(242,180,80,.13),transparent 55%),rgba(4,5,9,.55);color:var(--gold);cursor:pointer;transition:opacity 1.4s;font:inherit}
#open .to{font:400 clamp(56px,11vw,96px)/1.1 "Great Vibes",cursive;text-shadow:0 0 22px rgba(242,196,90,.55),0 0 50px rgba(242,140,60,.25);animation:breathe 3.2s ease-in-out infinite}
#open .tap{font:400 14px "Outfit",sans-serif;color:#cfc6b0;opacity:.8}
#open:focus-visible{outline:none}#open:focus-visible .tap{text-decoration:underline}
#open.gone{opacity:0;pointer-events:none}
@keyframes breathe{50%{text-shadow:0 0 30px rgba(242,196,90,.85),0 0 70px rgba(242,140,60,.4)}}
#snd{position:fixed;top:max(10px,env(safe-area-inset-top));right:10px;width:44px;height:44px;border:0;border-radius:50%;background:var(--glass);color:#e9dcbc;display:grid;place-items:center;cursor:pointer;opacity:0;transition:opacity 1.2s;pointer-events:none}
#snd.show{opacity:.75;pointer-events:auto}#snd:hover{opacity:1}#snd:focus-visible{outline:2px solid var(--gold)}
#snd .off{display:none}#snd[aria-pressed=false] .on{display:none}#snd[aria-pressed=false] .off{display:inline}
@media(prefers-reduced-motion:reduce){#open .to{animation:none}}
@media(max-width:600px){#hint{font-size:12px}}
</style>
</head>
<body>
<canvas id="c" aria-label="Animated 3D Christmas tree made of glowing characters"></canvas>
<div id="hint">Drag to turn · scroll or pinch to zoom</div>
<div id="msg"><span class="to">To <span class="emo">🍓🥛</span></span>Merry Christmas</div>
<button id="open" type="button"><span class="to">To <span class="emo">🍓🥛</span></span><span class="tap">Tap to open · sound on</span></button>
<button id="snd" type="button" aria-pressed="true" aria-label="Sound"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path class="on" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="off" d="M17 9l5 6M22 9l-5 6"/></svg></button>
<script>
{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const off=document.createElement('canvas'),g=off.getContext('2d');
const msg=document.getElementById('msg'),hint=document.getElementById('hint');
const small=Math.min(innerWidth,innerHeight)<700;
const Q=small?0.6:1;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const TOP=4.85,STAR_Y=5.08,LOOK=2.35;
const L=(()=>{const v=[-0.4,0.6,-0.7],n=Math.hypot(...v);return v.map(a=>a/n)})();
const R=Math.random;
function hsl(h,s,l){h=(h%360+360)%360/360;const f=n=>{const k=(n+h*12)%12,a=s*Math.min(l,1-l);return 255*(l-a*Math.max(-1,Math.min(k-3,9-k,1)))};return[f(0),f(8),f(4)]}
const P=[];
function add(x,y,z,c,type,t,n,extra){const nl=n?Math.hypot(n[0],n[1],n[2]):1;P.push(Object.assign({x,y,z,r:c[0],g:c[1],b:c[2],type,t,nx:n?n[0]/nl:0,ny:n?n[1]/nl:0,nz:n?n[2]/nl:-1,ph:R()*6.283},extra))}

/* tree tiers */
const tiers=[];
for(let i=0;i<6;i++){const yb=0.55+i*0.63;tiers.push({yb,yt:yb+1.15,rb:0.35+1.65*(1-i/6)})}
function radiusAt(y){let m=0;for(const t of tiers){const h=(y-t.yb)/(t.yt-t.yb);if(h>=0&&h<=1)m=Math.max(m,t.rb*(1-h))}return m}
for(const t of tiers){
  const n=Math.round(2700*t.rb*Q);
  for(let k=0;k<n;k++){
    const h=1-Math.sqrt(R()),a=R()*6.283,r=t.rb*(1-h)*(0.86+0.14*R());
    const y=t.yb+h*(t.yt-t.yb)-0.38*(1-h)**2+(R()-.5)*0.05,e=1-h;
    add(Math.cos(a)*r,y,Math.sin(a)*r,hsl(95+R()*35,0.55+0.25*R(),0.12+0.3*e**3+0.07*R()),0,2+3*y/TOP,[Math.cos(a),0.6,Math.sin(a)]);
  }
}
/* trunk */
for(let k=0;k<700*Q;k++){const a=R()*6.283,y=R()*0.75;add(Math.cos(a)*0.26,y,Math.sin(a)*0.26,hsl(25,0.35,0.13+0.08*R()),1,2+3*y/TOP,[Math.cos(a),0,Math.sin(a)])}
/* golden dial rings */
const rings=[2.0,2.22,2.5,2.75,3.05,3.3,3.6];
rings.forEach((rad,ri)=>{
  const sp=(ri%2?1:-1)*(0.04+ri*0.012),s1=7+ri*3,s2=23+ri*5,o=R()*6;
  const rows=ri%2?[0,0.07]:[0];
  for(const dr of rows){const rr=rad+dr;for(let a=0;a<6.283;a+=0.034/rr){
    if(Math.sin(a*s1+o)<-0.55||Math.sin(a*s2+o*2)<-0.9)continue;
    add(0,0,0,hsl(42+R()*10,0.85,0.48+0.12*R()),2,0.2+(rad-2.0)*0.5+R()*0.3,null,{rad:rr,ang:a,sp});
  }}
});
for(let a=0;a<6.283;a+=Math.PI/24)for(let r=2.56;r<2.7;r+=0.035)add(0,0,0,hsl(45,0.8,0.55),2,1+R()*0.4,null,{rad:r,ang:a,sp:0.05});
/* spiral lights */
for(let st=0;st<3;st++){const n=Math.round(520*Q);for(let k=0;k<n;k++){
  const s=k/n,y=0.75+s*3.85,a=s*6*6.283+st*2.094,r=radiusAt(y)+0.09;
  add(Math.cos(a)*r,y,Math.sin(a)*r,hsl(s*1080+st*120,1,0.6),3,7+2*s,[Math.cos(a),0.3,Math.sin(a)],{s});
}}
/* baubles */
const bc=[[230,40,50],[245,190,70],[220,60,200],[70,130,255],[240,240,250]];
for(let b=0;b<42;b++){
  const y=0.8+R()*3.5,a=R()*6.283,r=radiusAt(y)*0.96+0.1,cx=Math.cos(a)*r,cz=Math.sin(a)*r,c=bc[b%bc.length],t=8.4+R()*0.9;
  for(let k=0;k<70*Q+20;k++){let u=[R()-.5,R()-.5,R()-.5];const l=Math.hypot(...u)||1;u=u.map(v=>v/l);add(cx+u[0]*0.1,y+u[1]*0.1,cz+u[2]*0.1,c,4,t,u)}
}
/* star: two crossed five-point stars */
const sv=[];for(let i=0;i<10;i++){const a=Math.PI/2+i*Math.PI/5,r=i%2?0.15:0.38;sv.push([Math.cos(a)*r,Math.sin(a)*r])}
function inStar(x,y){let c=false;for(let i=0,j=9;i<10;j=i++){const[a,b]=sv[i],[d,e]=sv[j];if((b>y)!==(e>y)&&x<(d-a)*(y-b)/(e-b)+a)c=!c}return c}
for(let u=-0.4;u<=0.4;u+=0.022)for(let v=-0.4;v<=0.4;v+=0.022)if(inStar(u,v)){
  const c=hsl(48,1,0.62+0.2*R());add(u,STAR_Y+v,0,c,5,5);add(0,STAR_Y+v,u,c,5,5);
}
/* gifts */
const gifts=[{x:-0.95,z:-1.3,w:.55,h:.45,d:.5,c:[200,30,45],k:[245,200,80]},{x:0.45,z:-1.65,w:.42,h:.36,d:.4,c:[40,150,70],k:[220,40,50]},{x:1.35,z:-0.55,w:.46,h:.52,d:.46,c:[235,180,60],k:[200,30,45]},{x:-1.45,z:0.25,w:.42,h:.32,d:.42,c:[60,110,230],k:[240,240,245]}];
gifts.forEach((G,gi)=>{
  const t=9+gi*0.35,st=0.038;
  const face=(fx,fy,fz,n,u0,u1,v0,v1,map)=>{for(let u=u0;u<=u1;u+=st)for(let v=v0;v<=v1;v+=st){const[x,y,z,rb]=map(u,v);add(x,y,z,rb?G.k:G.c,6,t,n)}};
  const hw=G.w/2,hd=G.d/2,rw=0.06;
  face(0,0,0,[0,0,-1],-hw,hw,0,G.h,(u,v)=>[G.x+u,v,G.z-hd,Math.abs(u)<rw]);
  face(0,0,0,[0,0,1],-hw,hw,0,G.h,(u,v)=>[G.x+u,v,G.z+hd,Math.abs(u)<rw]);
  face(0,0,0,[-1,0,0],-hd,hd,0,G.h,(u,v)=>[G.x-hw,v,G.z+u,Math.abs(u)<rw]);
  face(0,0,0,[1,0,0],-hd,hd,0,G.h,(u,v)=>[G.x+hw,v,G.z+u,Math.abs(u)<rw]);
  face(0,0,0,[0,1,0],-hw,hw,-hd,hd,(u,v)=>[G.x+u,G.h,G.z+v,Math.abs(u)<rw||Math.abs(v)<rw]);
  for(let a=0;a<6.283;a+=0.12)for(let r=0.03;r<0.13;r+=0.03)add(G.x+Math.cos(a)*r*1.4,G.h+0.04+Math.abs(Math.sin(a))*r*0.7,G.z+Math.sin(a)*r*0.4,G.k,6,t+0.2,[0,1,-0.3]);
});
/* reindeer silhouette */
const seg=(ax,ay,bx,by,th)=>(u,v)=>{const dx=bx-ax,dy=by-ay,t=Math.max(0,Math.min(1,((u-ax)*dx+(v-ay)*dy)/(dx*dx+dy*dy)));return Math.hypot(u-ax-t*dx,v-ay-t*dy)<=th};
const ell=(cx,cy,rx,ry)=>(u,v)=>((u-cx)/rx)**2+((v-cy)/ry)**2<=1;
const deer=[ell(0,0.78,0.45,0.2),seg(-0.33,0.85,-0.52,1.18,0.085),ell(-0.62,1.2,0.15,0.085),seg(-0.3,0.65,-0.33,0,0.045),seg(-0.15,0.65,-0.1,0,0.045),seg(0.22,0.65,0.25,0,0.045),seg(0.36,0.65,0.42,0,0.045),seg(-0.54,1.28,-0.46,1.62,0.025),seg(-0.48,1.46,-0.33,1.56,0.022),seg(-0.5,1.56,-0.62,1.72,0.022),seg(-0.62,1.28,-0.72,1.56,0.025),seg(-0.69,1.46,-0.84,1.52,0.022),seg(0.42,0.86,0.52,0.93,0.04)];
for(let u=-0.9;u<=0.6;u+=0.021)for(let v=0;v<=1.76;v+=0.021)if(deer.some(f=>f(u,v)))for(const dz of[-0.035,0.035])add(1.6+u*0.9,v*0.9,-1.95+dz,[245,238,224],7,9.6+R()*0.4,[0,0.2,-1]);

/* atmosphere */
const stars=Array.from({length:small?160:260},()=>({x:R(),y:R()*0.9,s:0.4+R()*1.1,p:R()*6.28,v:0.5+R()*2}));
const snow=Array.from({length:small?70:130},()=>({x:R(),y:R(),s:0.6+R()*1.6,v:0.015+R()*0.035,p:R()*6.28}));
const CH=[".",":","+","*","#","@","=","%"];

/* state */
let W=0,H=0,dpr=1,cell=7,cols=0,rows=0,F=600,db,cr,cg,cb,cc;
let T=0,time=0,started=false,t0=0,k=0,collapsing=false,spin=!reduce,yaw=0.35,pitch=0.27,dist=11.5,distT=11.5,last=performance.now();
const filled=[];
function resize(){
  W=innerWidth;H=innerHeight;dpr=Math.min(2,devicePixelRatio||1);
  for(const c of[cv,off]){c.width=W*dpr;c.height=H*dpr}
  ctx.setTransform(dpr,0,0,dpr,0,0);g.setTransform(dpr,0,0,dpr,0,0);
  cell=W<600?5.5:7;cols=Math.ceil(W/cell);rows=Math.ceil(H/cell);
  const n=cols*rows;db=new Float32Array(n);cr=new Uint8Array(n);cg=new Uint8Array(n);cb=new Uint8Array(n);cc=new Uint8Array(n);
  F=Math.min(W*1.25,H*0.92)*1.18;
}
addEventListener('resize',resize);resize();
let cyw,syw,cp,sp,ke=0;
function proj(x,y,z){const X=x*cyw-z*syw,Z0=x*syw+z*cyw,yy=y-LOOK,Y=yy*cp+Z0*sp,Z=-yy*sp+Z0*cp+dist,f=F/Z;return[W/2+X*f,H*0.46-Y*f,Z,f]}

function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;time+=dt;T=started?(now-t0)/1000:0;
  if(spin&&!drag)yaw+=dt*0.16;
  if(collapsing)k=Math.min(1,k+dt/1.6);
  ke=k*k*(3-2*k);dist+=(distT-dist)*0.12;
  cyw=Math.cos(yaw);syw=Math.sin(yaw);cp=Math.cos(pitch);sp=Math.sin(pitch);

  /* sky */
  const bg=ctx.createRadialGradient(W/2,H*0.75,0,W/2,H*0.75,Math.max(W,H)*0.9);
  bg.addColorStop(0,'#17131f');bg.addColorStop(0.5,'#0a0a12');bg.addColorStop(1,'#040509');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  for(const s of stars){ctx.globalAlpha=0.35+0.45*(0.5+0.5*Math.sin(time*s.v+s.p));ctx.fillStyle='#fff';ctx.fillRect(s.x*W,s.y*H,s.s,s.s)}
  ctx.globalAlpha=1;
  const o=proj(0,0,0),gl=ctx.createRadialGradient(o[0],o[1],0,o[0],o[1],o[3]*4.6);
  gl.addColorStop(0,`rgba(242,180,80,${0.16*(1-ke*0.6)})`);gl.addColorStop(1,'rgba(242,180,80,0)');
  ctx.fillStyle=gl;ctx.fillRect(0,0,W,H);

  /* rasterise points into the character grid */
  db.fill(1e9);filled.length=0;
  for(const p of P){
    let a=(T-p.t)/0.5;if(a<=0)continue;if(a>1)a=1;
    let x=p.x,y=p.y,z=p.z,fade=1;
    if(p.type===2){const an=p.ang+time*p.sp;x=Math.cos(an)*p.rad;z=Math.sin(an)*p.rad;fade=1-ke}
    else if(ke>0){y=y*(1-ke)+0.03*ke;const s=1-0.55*ke;x*=s;z*=s}
    if(fade<0.02)continue;
    const X=x*cyw-z*syw,Z0=x*syw+z*cyw,yy=y-LOOK,Y=yy*cp+Z0*sp,Z=-yy*sp+Z0*cp+dist;
    if(Z<0.5)continue;
    const f=F/Z,gx=(W/2+X*f)/cell|0,gy=(H*0.46-Y*f)/cell|0;
    if(gx<0||gy<0||gx>=cols||gy>=rows)continue;
    const i=gy*cols+gx;if(Z>=db[i])continue;
    let br,ch;
    if(p.type===2){br=(0.6+0.4*Math.sin(time*1.8+p.ph))*fade;ch=6}
    else if(p.type===3){br=0.35+0.95*(0.5+0.5*Math.sin(time*5-p.s*70));ch=3}
    else if(p.type===5){br=1.25+0.2*Math.sin(time*3);ch=3}
    else{
      const nx=p.nx*cyw-p.nz*syw,nz=p.nx*syw+p.nz*cyw,d=nx*L[0]+p.ny*L[1]+nz*L[2];
      br=0.22+0.85*Math.max(0,d);
      if(p.type===0){br*=1+(1-a)*2.2;ch=Math.min(5,br*4.2|0)}
      else if(p.type===4){br+=0.5*Math.max(0,Math.sin(time*2+p.ph))**8;ch=5}
      else if(p.type===7){br=0.75+0.35*br;ch=4}
      else ch=p.type===1?1:4;
    }
    br*=a*Math.max(0.35,1.2-(Z-dist)*0.1);
    if(db[i]===1e9)filled.push(i);
    db[i]=Z;cr[i]=Math.min(255,p.r*br);cg[i]=Math.min(255,p.g*br);cb[i]=Math.min(255,p.b*br);cc[i]=ch;
  }
  g.clearRect(0,0,W,H);
  g.font=`700 ${cell*1.32}px "Space Mono",monospace`;g.textAlign='center';g.textBaseline='middle';
  for(const i of filled){g.fillStyle=`rgb(${cr[i]},${cg[i]},${cb[i]})`;g.fillText(CH[cc[i]],(i%cols)*cell+cell/2,(i/cols|0)*cell+cell/2)}
  ctx.save();ctx.globalCompositeOperation='lighter';
  if(!small){ctx.filter='blur(6px)';ctx.globalAlpha=0.6;ctx.drawImage(off,0,0,W,H);ctx.filter='none';ctx.globalAlpha=1}
  ctx.drawImage(off,0,0,W,H);

  /* rising halo that scans the tree into being */
  if(T>1.6&&T<5.8&&ke<0.5){
    const hp=Math.max(0,Math.min(1,(T-2)/3)),hy=hp*TOP,hr=Math.max(radiusAt(hy)*1.15+0.45,0.8);
    const al=Math.min(1,(T-1.6)/0.4)*Math.min(1,(5.8-T)/0.5);
    for(const [w,c] of[[7,`rgba(242,200,110,${0.22*al})`],[2,`rgba(255,240,200,${0.9*al})`]]){
      ctx.beginPath();for(let s=0;s<=64;s++){const a=s/64*6.283,q=proj(Math.cos(a)*hr,hy,Math.sin(a)*hr);s?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])}
      ctx.strokeStyle=c;ctx.lineWidth=w;ctx.stroke();
    }
  }
  /* star rays and burst */
  if(T>5){
    const q=proj(0,STAR_Y*(1-ke)+0.03*ke,0),s=q[3]/90,pl=1+0.15*Math.sin(time*2.6),al=Math.min(1,(T-5)/0.4);
    const rg=ctx.createRadialGradient(q[0],q[1],0,q[0],q[1],60*s);
    rg.addColorStop(0,`rgba(255,235,170,${0.55*al})`);rg.addColorStop(1,'rgba(255,200,100,0)');
    ctx.fillStyle=rg;ctx.fillRect(q[0]-60*s,q[1]-60*s,120*s,120*s);
    ctx.translate(q[0],q[1]);ctx.rotate(time*0.15);
    for(let r=0;r<8;r++){const len=(r%2?28:75)*s*pl;const lg=ctx.createLinearGradient(0,0,len,0);
      lg.addColorStop(0,`rgba(255,245,210,${0.95*al})`);lg.addColorStop(1,'rgba(255,220,140,0)');
      ctx.fillStyle=lg;ctx.beginPath();ctx.moveTo(0,-1.4);ctx.lineTo(len,0);ctx.lineTo(0,1.4);ctx.fill();ctx.rotate(Math.PI/4)}
    ctx.setTransform(dpr,0,0,dpr,0,0);
    if(T<6.4){const b=(T-5)/1.4;for(let j=0;j<28;j++){const a=j/28*6.283+j,d=b*120*s*(0.6+0.4*Math.sin(j*7));
      ctx.fillStyle=`rgba(255,230,160,${1-b})`;ctx.fillRect(q[0]+Math.cos(a)*d,q[1]+Math.sin(a)*d,2,2)}}
  }
  ctx.restore();
  /* snow */
  ctx.fillStyle='rgba(255,255,255,.7)';
  for(const f of snow){f.y+=f.v*dt;f.x+=Math.sin(time*0.8+f.p)*0.0003;if(f.y>1.02){f.y=-0.02;f.x=R()}
    ctx.beginPath();ctx.arc(f.x*W,f.y*H,f.s,0,6.283);ctx.fill()}

  msg.classList.toggle('on',T>11&&ke<0.3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* interaction */
let drag=false,moved=0;const ptrs=new Map();let pinch0=0,dist0=0;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);drag=true;moved=0;
  if(ptrs.size===2){const[a,b]=[...ptrs.values()];pinch0=Math.hypot(a[0]-b[0],a[1]-b[1]);dist0=distT}});
cv.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;const pr=ptrs.get(e.pointerId);
  if(ptrs.size===1){const dx=e.clientX-pr[0],dy=e.clientY-pr[1];moved+=Math.abs(dx)+Math.abs(dy);yaw-=dx*0.006;pitch=Math.max(0.04,Math.min(0.85,pitch+dy*0.004))}
  ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(ptrs.size===2){const[a,b]=[...ptrs.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pinch0)distT=Math.max(6,Math.min(20,dist0*pinch0/d))}});
const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch0=0;if(!ptrs.size)drag=false};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{e.preventDefault();distT=Math.max(6,Math.min(20,distT*(1+e.deltaY*0.001)))},{passive:false});

/* ---------- sound: everything synthesised with Web Audio ---------- */
let AC,master,rev,ambient=0;
const nf=m=>440*2**((m-69)/12);
function initAudio(){
  AC=new(window.AudioContext||window.webkitAudioContext)();
  const comp=AC.createDynamicsCompressor();comp.connect(AC.destination);
  master=AC.createGain();master.gain.value=0.85;master.connect(comp);
  const n=AC.sampleRate*3.4,b=AC.createBuffer(2,n,AC.sampleRate);
  for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<n;i++)d[i]=(R()*2-1)*(1-i/n)**2.8}
  rev=AC.createConvolver();rev.buffer=b;const rg=AC.createGain();rg.gain.value=0.5;rev.connect(rg);rg.connect(master);
}
function route(node,wet){node.connect(master);const w=AC.createGain();w.gain.value=wet;node.connect(w);w.connect(rev)}
function env(t,a,peak,dur){const g=AC.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);return g}
function bell(f,t,vol=0.12,dur=2.6,wet=0.6){
  [[1,1],[2.76,0.4],[5.4,0.2],[8.93,0.08]].forEach(([m,a])=>{const o=AC.createOscillator();o.type='sine';o.frequency.value=f*m;
    const g=env(t,0.004,vol*a,dur/(1+m*0.35));o.connect(g);route(g,wet);o.start(t);o.stop(t+dur)});
}
function box(f,t,vol=0.09){bell(f,t,vol,1.8,0.7)}
function noiseBuf(sec){const n=AC.sampleRate*sec,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=R()*2-1;return b}
function whoosh(t,dur,f0,f1,vol){
  const s=AC.createBufferSource();s.buffer=noiseBuf(dur);const bp=AC.createBiquadFilter();bp.type='bandpass';bp.Q.value=2.5;
  bp.frequency.setValueAtTime(f0,t);bp.frequency.exponentialRampToValueAtTime(f1,t+dur);
  const g=AC.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+dur*0.8);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(bp);bp.connect(g);route(g,0.5);s.start(t);
  const o=AC.createOscillator();o.type='sine';o.frequency.setValueAtTime(f0*0.5,t);o.frequency.exponentialRampToValueAtTime(f1*0.3,t+dur);
  const og=AC.createGain();og.gain.setValueAtTime(0.0001,t);og.gain.exponentialRampToValueAtTime(vol*0.25,t+dur*0.85);og.gain.exponentialRampToValueAtTime(0.0001,t+dur+0.2);
  o.connect(og);route(og,0.6);o.start(t);o.stop(t+dur+0.3);
}
function jingle(t){
  for(let i=0;i<14;i++){const tt=t+i*0.11+(i%2)*0.02+R()*0.02;
    const s=AC.createBufferSource();s.buffer=noiseBuf(0.25);const hp=AC.createBiquadFilter();hp.type='bandpass';hp.frequency.value=6500+R()*2500;hp.Q.value=6;
    const g=env(tt,0.003,0.11*(1-i/18),0.22);s.connect(hp);hp.connect(g);route(g,0.35);s.start(tt);
    bell(3800+R()*1800,tt,0.018,0.4,0.3);}
}
function pad(t,notes,dur,vol){
  notes.forEach((m,i)=>{for(const det of[-6,6]){const o=AC.createOscillator();o.type='triangle';o.frequency.value=nf(m);o.detune.value=det;
    const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1400;
    const g=AC.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+3+i*0.2);g.gain.setValueAtTime(vol,t+dur-4);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(lp);lp.connect(g);route(g,0.7);o.start(t);o.stop(t+dur+0.1)}});
}
const PENTA=[0,2,4,7,9];
function score(){
  const t=AC.currentTime+0.05;
  pad(t,[48,55,64,71,74],24,0.018);                                   // warm Cmaj9 bed
  for(let i=0;i<9;i++)box(nf(84+PENTA[i%5]+(i>4?12:0)),t+0.25+i*0.17+R()*0.05,0.035); // dial shimmer
  whoosh(t+1.8,3.4,260,3200,0.16);                                    // halo rising
  [72,79,84,88].forEach((m,i)=>bell(nf(m),t+5+i*0.015,0.11-i*0.015,4)); // star ignites
  for(let i=0;i<14;i++)bell(2600+R()*3500,t+5.05+R()*1.1,0.025,0.6,0.5); // sparkles
  for(let i=0;i<12;i++)box(nf(72+PENTA[i%5]+12*Math.floor(i/5)),t+7+i*0.17,0.07); // lights climb
  for(let i=0;i<8;i++)bell(nf(79+PENTA[(R()*5)|0]),t+8.4+i*0.12,0.045,0.9,0.4); // baubles pop
  jingle(t+9.1);                                                       // gifts & reindeer
  pad(t+10.6,[53,60,64,69,72],16,0.022);                               // greeting swell
  [76,79,84,83,79,81,79,76, 74,76,72].forEach((m,i)=>box(nf(m),t+11+i*0.38+(i>7?0.3:0),0.08)); // music box
  ambient=setTimeout(function tw(){if(AC.state==='running')box(nf(84+PENTA[(R()*5)|0]+(R()<.3?12:0)),AC.currentTime+0.02,0.03);ambient=setTimeout(tw,2200+R()*2600)},16500);
}
const openBtn=document.getElementById('open'),snd=document.getElementById('snd');
openBtn.addEventListener('click',()=>{
  try{initAudio();AC.resume();score()}catch(e){}
  started=true;t0=performance.now();
  openBtn.classList.add('gone');setTimeout(()=>openBtn.remove(),1500);
  hint.classList.add('show');setTimeout(()=>hint.classList.remove('show'),6500);
  if(AC)snd.classList.add('show');
},{once:true});
snd.addEventListener('click',()=>{if(!AC)return;const on=snd.getAttribute('aria-pressed')==='true';
  snd.setAttribute('aria-pressed',!on);master.gain.setTargetAtTime(on?0:0.85,AC.currentTime,0.08)});
}
</script>
